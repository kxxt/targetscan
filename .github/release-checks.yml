- name: Run workspace checks before packaging
  if: contains(matrix.targets, 'x86_64-unknown-linux-gnu')
  uses: ./.github/actions/check

# Newer Zig releases omit glibc for big-endian PowerPC.
- name: Install the big-endian PowerPC GNU linker
  if: contains(matrix.targets, 'powerpc-unknown-linux-gnu') || contains(matrix.targets, 'powerpc64-unknown-linux-gnu')
  run: python3 -m pip install 'cargo-zigbuild==0.24.1' 'ziglang==0.15.2'
